{% extends 'base.html' %}

<title>{% block title %} Login {% endblock %}</title>

{% block content%}
<h1> Iniciar sesión </h1>
<form method='POST'>
    {% csrf_token %}
    <label>Usuario: </label>
    <input type='text' name='username'>

    <label>Contraseña:</label>
    <input type='password' name='password'>
    <button type='submit'>Iniciar sesión</button>

</form>
{% endblock %}
