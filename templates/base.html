<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Mi proyecto {% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class='bg-light'>
    
<nav class='navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4'>
    <div class='container-fluid'>
        <a class='navbar-brand' href={% url 'home' %}>Gestión de proyectos y tareas</a>
        
        <div class='d-flex align-items-center gap-2'>

        {% if user.is_authenticated %} <!--usuario autenticado-->
            <span class='text-white me-2'><strong>{{user.username}}</strong></span>
            <form method='POST' action={% url 'logout' %} class='d-inline'>
                {% csrf_token %}
                <button type='submit' class='btn btn-outline-danger btn-sm'>Cerrar sesión</button>
            </form>
            
        {% else %} <!--usuario no autenticado (anonimo)-->
            <a href= {% url 'login' %} class='btn btn-outline-light btn-sm'>Ingresar </a>
            <a href ="{% url 'registro' %}" class='btn btn-primary btn-sm'>Registrarme </a> 
        {% endif %}
        </div>
    </div>
</nav>

<main class='container my-4'>
    {% block content %}
    {% endblock %}
</main>



    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
