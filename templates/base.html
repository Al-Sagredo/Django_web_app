<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Mi proyecto {% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class='bg-light'>
    
<nav class='navbar'>
    {% if user.is_authenticated %} <!--usuario autenticado-->
        <span>Hola {{user.username}}</span>
        <form method='POST' action="{% url 'logout' %}">
            {% csrf_token %}
            <button type='submit'>Cerrar sesión</button>
        </form>
        
    {% else %} <!--usuario no autenticado (anonimo)-->
        
        {% comment %} <a href= "{% url 'login' %}">Ingresar </a>
        <a href ="{% url 'registro' %}">Registrarme </a> {% endcomment %}
    {% endif %}

</nav>

<main class='container my-4'>
    {% block content %}
    {% endblock %}
</main>



    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
